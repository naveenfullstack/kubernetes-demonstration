apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-website
  labels:
    app: nextjs-website

spec:

  selector:
    matchLabels:
      app: nextjs-website

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: nextjs-website

    spec:
      containers:
        - name: nextjs
          image: ${IMAGE_NAME}:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "80"
            - name: HOSTNAME
              value: "0.0.0.0"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-website-service

spec:
  type: ClusterIP

  selector:
    app: nextjs-website

  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP